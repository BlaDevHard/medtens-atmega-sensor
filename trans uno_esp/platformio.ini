; PlatformIO Project Configuration File — MedTens trans_uno_esp
;
; Firmware ESP01 (sensor-server v0.1.0)
; Recebe leituras do Arduino UNO via UART (RX=GPIO3, 9600 bps)
; e expõe servidor HTTP em 192.168.1.x:80
;
; https://docs.platformio.org/page/projectconf.html

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 9600
upload_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; Flash 512KB do ESP-01 clássico: 64KB para SPIFFS, resto para firmware
board_build.ldscript = eagle.flash.512k64.ld

build_flags =
    -D FW_VERSION=\"0.1.0\"
